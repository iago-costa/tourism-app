name: Android — Deploy to Google Play

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track (internal / alpha / beta / production)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-deploy
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  WORKING_DIR: frontend-react-native

jobs:
  skipped-no-android-tree:
    name: Android deploy skipped
    runs-on: ubuntu-latest
    if: hashFiles('frontend-react-native/android/app/build.gradle') == ''
    steps:
      - run: echo "No frontend-react-native/android — skipping Play deploy."

  build-and-deploy:
    name: Build AAB & Deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && hashFiles('frontend-react-native/android/app/build.gradle') != ''
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build Android App Bundle
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/${{ env.WORKING_DIR }}/android/app/upload-keystore.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.app_tourism
          releaseFiles: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: ${{ env.WORKING_DIR }}/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
