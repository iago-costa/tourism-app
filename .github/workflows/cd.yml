name: CI/CD Web + API

on:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend lint
        run: |
          cd backend
          pip install -r requirements.txt
          ruff check app/
          python3 -m compileall app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend check
        run: |
          cd frontend
          npm install
          npx svelte-kit sync
          npm run check
          npm run build

  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vars
        id: vars
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "repo_lc=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}-backend:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tourism-backend
          cache-to: type=gha,mode=max,scope=tourism-backend
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}-frontend:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}-frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=tourism-frontend
          cache-to: type=gha,mode=max,scope=tourism-frontend
