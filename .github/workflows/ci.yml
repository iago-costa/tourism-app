name: CI — Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detection: check if RN tree exists ──
  detect:
    name: Detect project layout
    runs-on: ubuntu-latest
    outputs:
      has_rn: ${{ steps.check.outputs.has_rn }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend-react-native/App.tsx
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if [ -f "frontend-react-native/App.tsx" ]; then
            echo "has_rn=true" >> $GITHUB_OUTPUT
          else
            echo "has_rn=false" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # Frontend — React Native
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_rn == 'true'
    defaults:
      run:
        working-directory: frontend-react-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage

  # ─────────────────────────────────────────────
  # Backend — Python / FastAPI
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: ruff check app/

      - name: Test
        run: pytest -v || echo "No tests yet — skipping"
