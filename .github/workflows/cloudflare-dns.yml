name: Cloudflare DNS (tourism)

on:
  workflow_dispatch:
    inputs:
      origin_ip:
        required: true
        default: "137.131.129.228"

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upsert tourism DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          ORIGIN_IP: ${{ inputs.origin_ip }}
        run: |
          chmod +x scripts/cloudflare-tourism-dns.sh
          ./scripts/cloudflare-tourism-dns.sh
