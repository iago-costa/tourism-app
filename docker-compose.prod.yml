services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - tourism_pgdata:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    image: ${APP_IMAGE_BACKEND:-ghcr.io/iago-costa/tourism-app-backend:latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-tourism}
      FRONTEND_URL: https://tourism.vivdio.com
      GOOGLE_OAUTH_REDIRECT_URI: https://tourism.vivdio.com/auth/google/callback
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    networks:
      - internal
      - vivdio_proxy-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tourism-api.rule=Host(`tourism.vivdio.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
        - "traefik.http.routers.tourism-api.entrypoints=websecure"
        - "traefik.http.services.tourism-api.loadbalancer.server.port=8000"
        - "traefik.swarm.network=vivdio_proxy-net"

  frontend:
    image: ${APP_IMAGE_FRONTEND:-ghcr.io/iago-costa/tourism-app-frontend:latest}
    networks:
      - internal
      - vivdio_proxy-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tourism-web.rule=Host(`tourism.vivdio.com`)"
        - "traefik.http.routers.tourism-web.entrypoints=websecure"
        - "traefik.http.services.tourism-web.loadbalancer.server.port=3000"
        - "traefik.swarm.network=vivdio_proxy-net"

volumes:
  tourism_pgdata:

networks:
  internal:
    driver: overlay
  vivdio_proxy-net:
    external: true
