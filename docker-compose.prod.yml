services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - tourism_pgdata:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    image: ${APP_IMAGE_BACKEND:-tourism-backend:latest}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-tourism}
      FRONTEND_URL: https://tourism.vivdio.com
      GOOGLE_OAUTH_REDIRECT_URI: https://tourism.vivdio.com/auth/google/callback
    networks:
      - internal
      - vivdio_proxy-net
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tourism-api.rule=Host(`tourism.vivdio.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`))"
        - "traefik.http.routers.tourism-api.entrypoints=websecure"
        - "traefik.http.services.tourism-api.loadbalancer.server.port=8000"
        - "traefik.swarm.network=vivdio_proxy-net"

  frontend:
    image: ${APP_IMAGE_FRONTEND:-tourism-frontend:latest}
    networks:
      - internal
      - vivdio_proxy-net
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.tourism-web.rule=Host(`tourism.vivdio.com`)"
        - "traefik.http.routers.tourism-web.entrypoints=websecure"
        - "traefik.http.services.tourism-web.loadbalancer.server.port=4173"
        - "traefik.swarm.network=vivdio_proxy-net"

volumes:
  tourism_pgdata:

networks:
  internal:
    driver: overlay
  vivdio_proxy-net:
    external: true
