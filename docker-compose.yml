version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: tourism_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism_dev
      POSTGRES_DB: tourism_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tourism_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
